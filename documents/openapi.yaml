openapi: 3.1.0
info:
  title: Ride Share API
  version: 0.1.0
  description: |
    Contract for the ride-share backend.

    Every request must include the `x-key` header, otherwise the server responds with 401.

    Only University of Manitoba students can use the app. Sign up with an `@myumanitoba.ca`
    email, open the link in the verification email, then log in with `POST /auth/login`.
    Send the returned token as `Authorization: Bearer <token>` on every other request.
    Sign up and the `/auth` endpoints are the only ones that don't need the token.

    Riders pay for a seat by card through Stripe once the driver accepts their request. Card details
    go straight from the browser to Stripe; this API only starts payments and hears back from Stripe
    on `POST /payments/webhook`, the one route without `x-key` (Stripe signs those calls instead).

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://bisonrides-api.onrender.com
    description: Deployed on Render

# Applies to every operation unless it says otherwise: the API key AND a login token.
security:
  - ApiKeyHeader: []
    BearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Rides
  - name: Requests
  - name: Updates
  - name: Payments

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with a student email and password
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login successful. Send `access_token` as a Bearer token from now on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Wrong email or password (the same response for both)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The student hasn't verified their email yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify a student email with the token from the emailed link
      description: The link in the email opens the frontend's `/verify?token=...` page, which sends the token here. Verifying twice is fine.
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Email verified, the student can log in now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: The link is invalid or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Email a new verification link
      description: Returns 204 whether or not the email has an account, so it can't be used to find out who signed up. Nothing is sent if the account is already verified.
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "204":
          description: A new link was sent if the account exists and isn't verified yet
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account with an @myumanitoba.ca email
      description: Emails a verification link to the student. The account can't log in until the link is opened.
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Account created, not verified yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: An account with this username or email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid body, including an email that isn't @myumanitoba.ca
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: The logged-in student's own account
      responses:
        "200":
          description: The logged-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /rides:
    get:
      tags: [Rides]
      operationId: listRides
      summary: List all rides, soonest first
      responses:
        "200":
          description: List of rides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Rides]
      operationId: createRide
      summary: The logged-in driver posts a ride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRideRequest" }
      responses:
        "201":
          description: Ride created, with the logged-in user as the driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The logged-in user is not a driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /rides/{ride_id}:
    parameters:
      - $ref: "#/components/parameters/RideId"
    patch:
      tags: [Rides]
      operationId: updateRide
      summary: The ride's driver updates it (partial update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRideRequest" }
      responses:
        "200":
          description: Updated ride
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotYourRide" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Rides]
      operationId: deleteRide
      summary: The ride's driver deletes it
      responses:
        "204":
          description: Ride deleted, along with its pending requests
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotYourRide" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The ride has accepted riders and cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rides/{ride_id}/requests:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Requests]
      operationId: createRideRequest
      summary: The logged-in rider asks to join a ride
      description: No request body. The rider is whoever is logged in.
      responses:
        "201":
          description: Request created with status `pending`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The logged-in user is this ride's driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The rider already requested or already joined this ride
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /requests/{request_id}/accept:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    patch:
      tags: [Requests]
      operationId: acceptRideRequest
      summary: The ride's driver accepts a request
      description: Sets status to `accepted` and adds the rider to the ride.
      responses:
        "200":
          description: Request accepted, the rider is registered for the ride
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideRegistration" }
        "400":
          description: The ride is full, or the ride's driver is no longer a driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The logged-in user is not this ride's driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The request is not pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /requests/{request_id}/decline:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    patch:
      tags: [Requests]
      operationId: declineRideRequest
      summary: The ride's driver declines a request
      responses:
        "200":
          description: Request declined (empty body)
        "400":
          description: The ride's driver is no longer a driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The logged-in user is not this ride's driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The request is not pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /requests/{request_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    delete:
      tags: [Requests]
      operationId: cancelRideRequest
      summary: The rider cancels their own request
      description: |
        If the request was already accepted, the rider is also removed from the ride.
        A paid seat is refunded in full, and an unpaid payment is cancelled so it can't go through
        later. Stripe is asked first: if it can't refund, nothing changes and the rider can retry.
      responses:
        "204":
          description: Request cancelled
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The request belongs to someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/PaymentProviderError" }

  /requests/{request_id}/payment:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Payments]
      operationId: startPayment
      summary: Start (or pick up) paying for an accepted seat
      description: |
        Only the rider who made the request can pay, and only after the driver accepts it.
        The amount is the ride's `price_cents`, set by the server. Calling this again returns the
        same payment, updated if the driver changed the price before the rider paid.

        Pass `client_secret` to Stripe's Payment Element in the browser to take the card. The seat
        counts as paid once Stripe confirms it to `POST /payments/webhook`, usually within seconds.
      responses:
        "200":
          description: The payment for this seat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The request belongs to someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The driver hasn't accepted the request, or the ride has no price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/PaymentProviderError" }
        "503": { $ref: "#/components/responses/PaymentsNotSetUp" }
    get:
      tags: [Payments]
      operationId: readPayment
      summary: Whether a seat is paid
      description: Never contacts Stripe and never includes `client_secret`.
      responses:
        "200":
          description: The payment for this seat (`unpaid` if none was started)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The request belongs to someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The driver hasn't accepted the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /payments/webhook:
    post:
      tags: [Payments]
      operationId: stripeWebhook
      summary: Stripe reports a payment event (called by Stripe, not the frontend)
      description: |
        Needs no `x-key` or login. Instead the `Stripe-Signature` header must be a valid signature
        of the raw body with `STRIPE_WEBHOOK_SECRET`. Point Stripe straight at the backend
        (`https://bisonrides-api.onrender.com/payments/webhook`), not through the frontend's `/api`
        proxy, which doesn't forward that header.

        Only `payment_intent.succeeded` does anything: it marks the seat paid and emails the rider
        a receipt. Repeats of the same event are ignored. Other events are acknowledged and ignored.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Stripe event object
      responses:
        "204":
          description: Event received
        "400":
          description: Not signed by Stripe with our webhook secret, or not valid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/PaymentsNotSetUp" }

  /updates:
    get:
      tags: [Updates]
      operationId: getUpdates
      summary: Get everything needed to refresh the page for the logged-in user
      description: |
        Returns pending requests waiting on this user (as a driver) and requests
        this user made (as a rider) that have since been accepted or declined.
      responses:
        "200":
          description: Updates for the logged-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updates" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-key
      description: Required on every request. Missing or invalid returns 401.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from `POST /auth/login`. Expires after 24 hours.

  parameters:
    RideId:
      name: ride_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid `x-key` header, or not logged in (missing, invalid or expired token)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotYourRide:
      description: The logged-in user is not this ride's driver
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body or parameters failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentProviderError:
      description: Stripe couldn't be reached or refused the request. Try again in a minute.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentsNotSetUp:
      description: The server has no Stripe keys (`STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          description: A message for most errors. For 422 validation errors, a list of what failed.
          oneOf:
            - type: string
            - type: array
              items: { type: object }

    User:
      type: object
      description: Public account details. Never includes the password hash.
      required: [id, username, email, is_driver, is_verified]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        is_driver: { type: boolean }
        is_verified: { type: boolean, description: Whether the student has opened the verification link }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: Not case-sensitive }
        password:
          type: string
          format: password
          description: Plaintext password, sent over HTTPS. The server hashes and compares it.

    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string, description: "Send as `Authorization: Bearer <token>`" }
        token_type: { type: string, enum: [bearer] }
        user: { $ref: "#/components/schemas/User" }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: The `token` query parameter from the emailed link }

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    CreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 36, description: Must be unique }
        email:
          type: string
          format: email
          maxLength: 255
          description: Must be an @myumanitoba.ca student email. Stored in lowercase.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Must have an uppercase letter, a lowercase letter, a number and a symbol.
        is_driver: { type: boolean, default: false }

    GeoJSONPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          description: "[longitude, latitude]"
          minItems: 2
          maxItems: 2
          items: { type: number }
      examples:
        - { type: Point, coordinates: [-97.1384, 49.8951] }

    Ride:
      type: object
      required: [id, driver_id, origin_point, departure_time, seats, price_cents]
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        origin_point: { $ref: "#/components/schemas/GeoJSONPoint" }
        departure_time: { type: string, format: date-time }
        seats: { type: integer, minimum: 0 }
        price_cents:
          type: [integer, "null"]
          description: What each rider pays for a seat, in cents (CAD). Null for rides posted before prices were saved.

    CreateRideRequest:
      type: object
      description: The driver is whoever is logged in.
      required: [origin_point, departure_time]
      properties:
        origin_point: { $ref: "#/components/schemas/GeoJSONPoint" }
        departure_time: { type: string, format: date-time }
        seats: { type: integer, minimum: 1, default: 1 }
        price_cents:
          type: integer
          minimum: 50
          description: Price per seat in cents, e.g. 500 for $5.00. At least Stripe's $0.50 minimum.

    UpdateRideRequest:
      type: object
      minProperties: 1
      properties:
        origin_point: { $ref: "#/components/schemas/GeoJSONPoint" }
        departure_time: { type: string, format: date-time }
        seats: { type: integer, minimum: 0 }
        price_cents:
          type: integer
          minimum: 50
          description: Riders who already paid keep the price they paid.

    RequestStatus:
      type: string
      enum: [pending, accepted, declined]

    RideRequest:
      type: object
      required: [id, ride_id, rider_id, status]
      properties:
        id: { type: string, format: uuid }
        ride_id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RequestStatus" }

    RideRegistration:
      type: object
      description: A rider who has been accepted onto a ride.
      required: [ride_id, rider_id]
      properties:
        ride_id: { type: string, format: uuid }
        rider_id: { type: string, format: uuid }

    Updates:
      type: object
      required: [pending_requests, request_updates]
      properties:
        pending_requests:
          type: array
          description: Requests on this user's rides that are still waiting for a response (driver view)
          items: { $ref: "#/components/schemas/RideRequest" }
        request_updates:
          type: array
          description: This user's requests that have been accepted or declined (rider view)
          items: { $ref: "#/components/schemas/RideRequest" }

    Payment:
      type: object
      description: A rider's card payment for their seat.
      required: [request_id, ride_id, amount_cents, status, client_secret]
      properties:
        request_id: { type: string, format: uuid }
        ride_id: { type: string, format: uuid }
        amount_cents:
          type: [integer, "null"]
          description: What the seat costs, or what was paid once it's paid. Null if the ride has no price.
        status:
          type: string
          enum: [unpaid, processing, paid]
          description: |
            `processing` means the rider paid in the browser and Stripe hasn't confirmed it to us yet.
            Only `POST` returns it; poll `GET` until it says `paid`.
        client_secret:
          type: [string, "null"]
          description: Only from `POST` while unpaid. Pass to Stripe's Payment Element; don't store it.
